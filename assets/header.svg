<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#0b3d4a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f5d4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px}
      .sub{font:500 20px 'Courier New',monospace;fill:#a8fff0;letter-spacing:3px}
      .fade{opacity:0;animation:in 1.6s ease-out .3s forwards}
      .fade2{opacity:0;animation:in 1.6s ease-out 1.1s forwards}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .scan{animation:scan 4s linear infinite}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(280px)}}
      .node{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- neural network nodes -->
  <g stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="60" x2="170" y2="120"/><line x1="80" y1="180" x2="170" y2="120"/>
    <line x1="170" y1="120" x2="250" y2="70"/><line x1="170" y1="120" x2="250" y2="190"/>
    <line x1="950" y1="70" x2="1040" y2="130"/><line x1="950" y1="200" x2="1040" y2="130"/>
    <line x1="1040" y1="130" x2="1120" y2="60"/><line x1="1040" y1="130" x2="1120" y2="200"/>
  </g>
  <g fill="#00f5d4">
    <circle class="node" cx="80" cy="60" r="5"/>
    <circle class="node" cx="80" cy="180" r="5" style="animation-delay:.4s"/>
    <circle class="node" cx="170" cy="120" r="7" style="animation-delay:.8s"/>
    <circle class="node" cx="250" cy="70" r="5" style="animation-delay:1.2s"/>
    <circle class="node" cx="250" cy="190" r="5" style="animation-delay:1.6s"/>
  </g>
  <g fill="#ff4fd8">
    <circle class="node" cx="950" cy="70" r="5" style="animation-delay:.2s"/>
    <circle class="node" cx="950" cy="200" r="5" style="animation-delay:.6s"/>
    <circle class="node" cx="1040" cy="130" r="7" style="animation-delay:1s"/>
    <circle class="node" cx="1120" cy="60" r="5" style="animation-delay:1.4s"/>
    <circle class="node" cx="1120" cy="200" r="5" style="animation-delay:1.8s"/>
  </g>

  <!-- scanning line -->
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#00f5d4" opacity="0.35"/>

  <text class="title fade" x="600" y="128" text-anchor="middle" fill="url(#txt)" filter="url(#glow)">Shermaine Yap</text>
  <text class="sub fade2" x="600" y="176" text-anchor="middle">DATA ANALYST  ·  AI &amp; DEEP LEARNING</text>

  <!-- bottom wave -->
  <path fill="#00f5d4" fill-opacity="0.12">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 230 Q300 200 600 230 T1200 230 V260 H0Z;
              M0 230 Q300 255 600 228 T1200 232 V260 H0Z;
              M0 230 Q300 200 600 230 T1200 230 V260 H0Z"/>
  </path>
</svg>
